<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cya Mentor | Cyber Kalari</title>
<meta name="description" content="Cya Mentor - Cyber Kalari course assistant. CCNA, Windows System Admin, CCNP courses in Malayalam.">
<meta name="theme-color" content="#0B1F4B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F4B; --navy-2:#132B63; --teal:#0B7F85; --bright:#12F2D8; --gold:#FFC83D;
    --bg:#F4F7FB; --ink:#0B1F4B; --muted:#5B6B8C; --line:#DCE3EE; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Manrope","Noto Sans Malayalam",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:720px; height:100dvh; display:flex; flex-direction:column; background:var(--white); box-shadow:0 0 0 1px var(--line)}
  header{
    background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .logo{width:46px; height:46px; border-radius:50%; flex:none; display:block; object-fit:contain}
  .head-text{flex:1; min-width:0}
  .head-text h1{margin:0; font-size:17px; font-weight:800}
  .head-text p{margin:2px 0 0; font-size:12px; color:#B9C6E4}
  .status{display:inline-block; width:8px; height:8px; border-radius:50%; background:#7C8BAA; margin-right:6px; vertical-align:middle}
  .status.on{background:var(--bright)}
  .icon-btn{
    background:transparent; border:1px solid #3A4E80; color:#fff; border-radius:10px;
    height:38px; min-width:38px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font:600 12px "Manrope",sans-serif; cursor:pointer;
  }
  .icon-btn[aria-pressed="true"]{background:var(--teal); border-color:var(--teal)}
  header{position:relative}
  .lang-hint{
    position:absolute; top:calc(100% + 10px); right:70px; z-index:20; width:max-content; max-width:min(320px, calc(100vw - 24px));
    background:#fff; color:var(--navy); border-radius:14px; padding:10px 34px 10px 14px;
    box-shadow:0 10px 30px rgba(11,31,75,.25); border:1px solid var(--line); cursor:pointer;
    font-size:13.5px; line-height:1.4; animation:hintIn .35s ease-out;
  }
  .lang-hint::before{content:""; position:absolute; top:-8px; right:70px; border:8px solid transparent; border-top:0; border-bottom-color:#fff}
  .lang-hint b{display:block; font-family:"Noto Sans Malayalam",sans-serif; font-size:15px; color:var(--teal); white-space:nowrap}
  .lang-hint .x{position:absolute; top:4px; right:6px; border:0; background:none; font-size:18px; color:#889; cursor:pointer; padding:2px 6px}
  .lang-hint.hide{display:none}
  .sound-hint{right:12px}
  .sound-hint::before{right:40px !important}
  #voiceToggle.attn{animation:attn 1.4s ease-in-out 4}
  #langMl.attn{animation:attn 1.4s ease-in-out 4}
  @keyframes attn{0%,100%{box-shadow:0 0 0 0 rgba(18,242,216,.8)}60%{box-shadow:0 0 0 8px rgba(18,242,216,0)}}
  @keyframes hintIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
  @media (max-width:420px){ .lang-hint{right:12px} .lang-hint::before{right:66px} }
  .help-link{background:none;border:none;color:var(--teal);font:700 11.5px "Manrope","Noto Sans Malayalam",sans-serif;cursor:pointer;padding:0;text-decoration:underline}
  .msg.system .help-link{font-size:12px}
  .modal-bg{position:fixed;inset:0;background:rgba(11,31,75,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.hide{display:none}
  .modal{background:#fff;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  @media (min-width:600px){ .modal-bg{align-items:center} .modal{border-radius:18px} }
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal .lead{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .modal .x2{float:right;border:none;background:#EEF3FA;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--navy)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:700 12.5px "Manrope",sans-serif;color:var(--navy);cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .modal ol{margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.6}
  .modal ol li{margin-bottom:6px}
  .modal .note{background:#F4F7FB;border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .modal .test{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .modal .test button{border:none;background:var(--teal);color:#fff;border-radius:10px;padding:9px 14px;font:700 13px "Manrope","Noto Sans Malayalam",sans-serif;cursor:pointer}
  .modal .status-line{font-size:12.5px;margin:6px 0 0;color:var(--navy)}
  .lang-switch{display:flex; border:1px solid #3A4E80; border-radius:10px; overflow:hidden; height:38px; flex:none}
  .lang-switch button{background:transparent; border:none; color:#B9C6E4; padding:0 10px; font:700 12px "Manrope","Noto Sans Malayalam",sans-serif; cursor:pointer}
  .lang-switch button[aria-pressed="true"]{background:var(--bright); color:var(--navy)}
  @media (max-width:420px){ #voiceLabel{display:none} header{gap:8px; padding-left:12px; padding-right:12px} }
  .icon-btn svg{width:18px; height:18px}

  #chat{flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth}
  .msg{max-width:86%; padding:11px 14px; border-radius:16px; line-height:1.55; font-size:15px; white-space:pre-wrap; word-wrap:break-word}
  .msg.agent{background:#EEF3FA; border-top-left-radius:4px; align-self:flex-start}
  .msg.user{background:var(--teal); color:#fff; border-top-right-radius:4px; align-self:flex-end}
  .msg a{color:var(--teal); font-weight:700}
  .msg.user a{color:#fff}
  .msg .wa{
    display:inline-block; margin-top:6px; background:#1FAF55; color:#fff !important; text-decoration:none;
    padding:8px 14px; border-radius:999px; font-weight:700;
  }
  .msg.system{align-self:center; background:transparent; color:var(--muted); font-size:12px; padding:2px 8px; text-align:center}
  .speak-btn{display:block; margin-top:6px; background:none; border:none; color:var(--teal); font:600 12px "Manrope",sans-serif; cursor:pointer; padding:0}
  .typing{align-self:flex-start; display:none; gap:4px; padding:12px 14px; background:#EEF3FA; border-radius:16px}
  .typing.show{display:flex}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25; transform:translateY(0)}40%{opacity:1; transform:translateY(-3px)}}

  .welcome{text-align:center; padding:96px 10px 6px}
  @media (max-width:420px){ .welcome{padding-top:104px} }
  .welcome .big-logo{width:96px; height:96px; margin:0 auto 14px; border-radius:50%}
  .welcome h2{margin:0 0 6px; font-size:20px}
  .welcome p{margin:0; color:var(--muted); font-size:14px}
  .chips.qr{justify-content:flex-start; align-self:flex-start; max-width:94%; padding:0 0 2px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px 6px 4px}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:999px;
    padding:8px 14px; font:600 13px "Manrope","Noto Sans Malayalam",sans-serif; cursor:pointer;
  }
  .chip:hover{border-color:var(--teal); color:var(--teal)}

  footer{border-top:1px solid var(--line); padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:#fff}
  .row{display:flex; gap:8px; align-items:flex-end}
  textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:14px; padding:11px 14px;
    font:15px "Manrope","Noto Sans Malayalam",sans-serif; color:var(--ink); max-height:120px; outline:none; background:#FAFCFF;
  }
  textarea:focus{border-color:var(--teal)}
  .round{
    width:46px; height:46px; border-radius:50%; border:none; display:grid; place-items:center; cursor:pointer; flex:none;
  }
  .round svg{width:21px; height:21px}
  #send{background:var(--teal); color:#fff}
  #send:disabled{opacity:.45; cursor:default}
  #mic{background:#EEF3FA; color:var(--navy)}
  #mic.listening{background:var(--gold); color:var(--navy); animation:p 1.2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(255,200,61,.6)}100%{box-shadow:0 0 0 12px rgba(255,200,61,0)}}
  .sub{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:var(--muted)}
  .sub select{border:1px solid var(--line); border-radius:8px; padding:3px 6px; font:600 11.5px "Manrope",sans-serif; color:var(--navy); background:#fff}
  .sub a{color:var(--teal); font-weight:700; text-decoration:none}
</style>
</head>

/* ===== Helpers ===== */
const MALAYALAM = /[ഀ-ൿ]/;
function setStatus(on, text){ dot.classList.toggle("on", on); statusText.textContent = text; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function renderMarkdown(text){
  let html = escapeHtml(text);
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => {
    try {
      const u = new URL(url.replace(/&amp;/g, "&"));
      if (!ALLOWED_LINK_HOSTS.includes(u.hostname)) return label;
      const cls = u.hostname === "wa.me" ? ' class="wa"' : "";
      return `<a${cls} href="${escapeHtml(u.href)}" target="_blank" rel="noopener">${label}</a>`;
    } catch { return label; }
  });
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function plainForSpeech(text){
  return text
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/[*_#`>]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

}

/* ===== Free device voice (text-to-speech) ===== */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(lang){
  const l = lang.toLowerCase();
  const exact = voices.filter(v => v.lang.toLowerCase().replace("_","-") === l);
  const prefix = voices.filter(v => v.lang.toLowerCase().startsWith(l.split("-")[0]));
  const pool = exact.length ? exact : prefix;
  const natural = pool.find(v => /natural|online|neural/i.test(v.name) && /sobhana|female|woman|neerja|swara/i.test(v.name)) || pool.find(v => /natural|online|neural/i.test(v.name));
  const female = pool.find(v => /female|woman|sobhana|heera|veena|neerja|swara|sangeeta/i.test(v.name));
  return natural || female || pool.find(v => /google/i.test(v.name)) || pool[0] || null;
}

let warnedNoMl = false;
function speak(text, force = false){
  if (!window.speechSynthesis || (!voiceOn && !force)) return;
  const clean = plainForSpeech(text);
  if (!clean) return;
  speechSynthesis.cancel();
  const isMl = MALAYALAM.test(clean);
  let voice = pickVoice(isMl ? "ml-IN" : "en-IN") || (!isMl ? pickVoice("en-GB") || pickVoice("en-US") : null);
  if (isMl && !voice) {
    if (!warnedNoMl) { addSystemHelp(T("noMl")); warnedNoMl = true; }
    return;
  }
  // Split into short chunks: some browsers stop long utterances midway.
  const parts = clean.match(/[^.!?।]+[.!?।]?/g) || [clean];
  parts.forEach(p => {
    const u = new SpeechSynthesisUtterance(p.trim());
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = isMl ? "ml-IN" : "en-IN"; }
    u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  });
}

}

const BY_ID = Object.fromEntries(KB.map(x => [x.id, x]));

function matchTopic(q){
  let best = null, bestScore = 0;
  for (const item of KB) {
    const s = item.k.reduce((n, re) => n + (re.test(q) ? 1 : 0), 0);
    if (s > bestScore) { best = item; bestScore = s; }
  }
  return best;
}
function answerTopic(item){
  const text = R(item.en, item.ml) + (item.wa ? waBtn(item.wa) : "");
  reply(text, (item.quick || []).filter(x => Q[x]).map(x => Q[x]()));
}

  if (flow && RE_CANCEL.test(q)) { flow = null; return reply(R("Okay, cancelled. Ask me anything about our courses.", "ശരി, cancel ചെയ്തു. Courses-നെ കുറിച്ച് എന്തും ചോദിക്കാം."), [Q.courses(), Q.guide()]); }
  if (flow && flow.type === "lead") return leadStep(q);
  if (flow && flow.type === "guide") return guideStep(q);
  const words = q.split(/\s+/).length;
  if (RE_GUIDE.test(q)) return startGuide();
  const item = matchTopic(q);
  if (RE_LEAD.test(q) && (!item || ["courses", "contact", "batch", "ccna", "windows", "ccnp", "combo"].includes(item.id))) return startLead();
  if (item) return answerTopic(item);
  if (words <= 4 && RE_GREET.test(q)) return reply(R(
    "Hi! I'm Cya, the Cyber Kalari course assistant. I can tell you about our courses, help you pick one, explain what IT jobs need, and pass your enquiry to our team.",
    "നമസ്കാരം! ഞാൻ Cya, Cyber Kalari-യുടെ course assistant. Courses-നെ കുറിച്ച് പറയാം, നിങ്ങൾക്ക് ചേരുന്നത് തിരഞ്ഞെടുക്കാൻ സഹായിക്കാം, IT ജോലികൾക്ക് എന്ത് വേണമെന്ന് പറയാം, നിങ്ങളുടെ enquiry team-ന് എത്തിക്കാം."), [Q.guide(), Q.courses(), Q.enquiry()]);
  if (words <= 4 && RE_THANKS.test(q)) return reply(R(
    "You're welcome! If you'd like our team to contact you, send your enquiry.",
    "സന്തോഷം! ഞങ്ങളുടെ team നിങ്ങളെ ബന്ധപ്പെടണമെങ്കിൽ enquiry അയക്കൂ."), [Q.enquiry()]);
  reply(R(
    "I'm not sure about that, and I'd rather not guess. Our team can answer it on WhatsApp, or pick a topic below.",
    "അതിനെ കുറിച്ച് എനിക്ക് ഉറപ്പില്ല, ഊഹിച്ച് പറയുന്നില്ല. ഞങ്ങളുടെ team WhatsApp-ൽ മറുപടി തരും, അല്ലെങ്കിൽ താഴെ ഒരു topic തിരഞ്ഞെടുക്കൂ.") + waBtn("Hi Cyber Kalari, I have a question: " + q.slice(0, 200)),
    [Q.courses(), Q.guide(), Q.tiers()]);
}

/* ===== Guide: which course suits me? ===== */
function startGuide(){
  flow = { type: "guide", step: 1, data: {} };
  reply(R("Two quick questions. First, which best describes you?", "രണ്ട് ചെറിയ ചോദ്യങ്ങൾ. ആദ്യം, നിങ്ങൾ ഏതാണ്?"), [
    { label: R("Student / non-IT background", "Student / non-IT background"), act: () => guideStep("A") },
    { label: R("IT or CS student / graduate", "IT / CS student / graduate"), act: () => guideStep("B") },
    { label: R("Working in IT support", "IT support-ൽ ജോലി ചെയ്യുന്നു"), act: () => guideStep("C") },
    { label: R("I have CCNA / network experience", "CCNA / network experience ഉണ്ട്"), act: () => guideStep("D") },
  ]);
}
function guideStep(ans){
  const f = flow;
  if (f.step === 1) {
    const a = /^[ABCD]$/.test(ans) ? ans : /non.?it|school|plus|12th|10th|commerce|arts|b\.?com/i.test(ans) ? "A" : /ccna|network/i.test(ans) ? "D" : /support|working|job/i.test(ans) ? "C" : /\b(cs|it|bca|mca|b\.?tech|engineering|computer)\b/i.test(ans) ? "B" : "A";
    f.data.bg = a; f.step = 2;
    return reply(R("And which area interests you most?", "ഏത് area-യിലാണ് കൂടുതൽ താല്പര്യം?"), [
      { label: R("Networking (Cisco)", "Networking (Cisco)"), act: () => guideStep("N") },
      { label: R("Windows / Microsoft", "Windows / Microsoft"), act: () => guideStep("W") },
      { label: R("Both: all-round IT Admin", "രണ്ടും: all-round IT Admin"), act: () => guideStep("B2") },
      { label: R("Not sure yet", "ഉറപ്പില്ല"), act: () => guideStep("U") },
    ]);
  }
  const i = /^(N|W|B2|U)$/.test(ans) ? ans : /network|cisco|ccna/i.test(ans) ? "N" : /windows|microsoft|server/i.test(ans) ? "W" : /both|randum|രണ്ടും/i.test(ans) ? "B2" : "U";
  const bg = f.data.bg; flow = null;
  let rec, why;
  if (bg === "D" && i !== "W") { rec = "CCNP Enterprise"; why = R("you already have the networking base, so CCNP is your next step towards Network Engineer roles.", "networking base ഇതിനകം ഉണ്ട്, Network Engineer ആകാനുള്ള next step CCNP ആണ്."); }
  else if (i === "N") { rec = "CCNA"; why = R("it is the standard starting point for Network Admin jobs.", "Network Admin ജോലികൾക്കുള്ള standard തുടക്കം CCNA ആണ്."); }
  else if (i === "W") { rec = "Microsoft / Windows System Admin"; why = R("it leads to System Admin roles with Windows Server, Active Directory and Microsoft 365.", "Windows Server, Active Directory, Microsoft 365 ഉപയോഗിക്കുന്ന System Admin ജോലികളിലേക്ക് ഇത് നയിക്കും."); }
  else { rec = "IT Admin Combo"; why = R("most small and mid-size companies want one person who can handle both the network and Windows.", "network-ഉം Windows-ഉം ഒരാൾ തന്നെ നോക്കുന്നതാണ് മിക്ക ചെറുകിട, ഇടത്തരം companies-നും വേണ്ടത്."); }
  lastRec = rec;
  const start = bg === "A" ? R(" Start with the free Level 0 to see if you enjoy it.", " ആദ്യം free Level 0 ചെയ്ത് നോക്കൂ.") : bg === "C" ? R(" With your support experience, the Pro tier will make you job-ready fastest.", " Support experience ഉള്ളതിനാൽ Pro tier ആണ് ഏറ്റവും വേഗം job-ready ആക്കുക.") : "";
  reply(R(`My suggestion: **${rec}**, because ${why}${start}\nOur team will confirm the best plan for you on WhatsApp.`, `എന്റെ suggestion: **${rec}**. കാരണം, ${why}${start}\nനിങ്ങൾക്കുള്ള ഏറ്റവും നല്ല plan team WhatsApp-ൽ confirm ചെയ്യും.`),
    [Q.enquiry(), { label: R("Tell me more about it", "കൂടുതൽ അറിയാൻ"), send: rec === "IT Admin Combo" ? "IT Admin Combo" : rec.split(" ")[0] }, Q.tiers()]);
}

/* ===== Enquiry: collect real details, then confirm on WhatsApp ===== */
const FAKE_WORDS = /^(test|testing|abc|abcd|asdf|asd|qwerty|xyz|name|user|admin|sample|demo|none|nil|na|n\/a|no|nothing|aaa+|xxx+|hello|hi|fake|dummy|unknown|anonymous|someone|nobody)$/i;
const DISPOSABLE = /@(mailinator|tempmail|temp-mail|10minutemail|guerrillamail|yopmail|trashmail|getnada|sharklasers|dispostable|fakeinbox|throwawaymail|maildrop|mintemail|emailondeck)\./i;
const TYPO_DOMAINS = { "gmial.com": "gmail.com", "gmai.com": "gmail.com", "gamil.com": "gmail.com", "gmail.co": "gmail.com", "gmail.con": "gmail.com", "gmail.cm": "gmail.com", "yaho.com": "yahoo.com", "yahoo.co": "yahoo.com", "hotmial.com": "hotmail.com", "outlok.com": "outlook.com" };

function checkName(v){
  v = v.replace(/^(my name is|i am|i'm|name|ente peru|എന്റെ പേര്)\s*:?\s*/i, "").replace(/\s+/g, " ").trim();
  const letters = (v.match(/[A-Za-zഀ-ൿ]/g) || []).length;
  if (v.length < 2 || v.length > 40 || letters < 2 || /[0-9@#$%^&*_=+<>{}[\]|\\/]/.test(v)) return { err: R("Please type your real full name (letters only).", "നിങ്ങളുടെ യഥാർത്ഥ മുഴുവൻ പേര് type ചെയ്യൂ (അക്ഷരങ്ങൾ മാത്രം).") };
  if (/\?/.test(v) || v.split(" ").length > 4 || matchTopic(v) || /\b(what|how|why|when|where|which|about|question|is|are|the|do|does|you|can|want|need|please|tell|course|details?)\b/i.test(v)) return { err: R("Please type just your name (for example: Arun Kumar).", "പേര് മാത്രം type ചെയ്യൂ (ഉദാ: Arun Kumar).") };
  const latin = v.split(" ").filter(w => /^[A-Za-z.'-]+$/.test(w));
  if (FAKE_WORDS.test(v) || /^(.)\1+$/i.test(v.replace(/\s/g, "")) || latin.some(w => (w.replace(/[.'-]/g, "").length > 3 && !/[aeiouy]/i.test(w)) || /([b-df-hj-np-tv-z])\1\1|[b-df-hj-np-tv-z]{5,}/i.test(w))) return { err: R("That doesn't look like a real name. Please type your actual name so our team can address you correctly.", "അത് യഥാർത്ഥ പേരായി തോന്നുന്നില്ല. Team-ന് നിങ്ങളെ ശരിയായി വിളിക്കാൻ യഥാർത്ഥ പേര് type ചെയ്യൂ.") };
  return { val: v.replace(/\b[a-z]/g, c => c.toUpperCase()) };
}
function checkPhone(v){
  const plus = v.trim().startsWith("+") || v.trim().startsWith("00");
  let d = v.replace(/\D/g, "");
  if (v.trim().startsWith("00")) d = d.slice(2);
  let full = null;
  if (!plus && d.length === 10 && /^[6-9]/.test(d)) full = "91" + d;
  else if (!plus && d.length === 11 && /^0[6-9]/.test(d)) full = "91" + d.slice(1);
  else if (d.length === 12 && /^91[6-9]/.test(d)) full = d;
  else if (plus && d.length >= 10 && d.length <= 15) full = d;
  else if (!plus && /^(968|971|966|974|973|965)\d{8,9}$/.test(d)) full = d;
  if (!full) return { err: R("Please give a valid WhatsApp number: 10 digits for India, or with the country code for other countries (for example +968 9123 4567).", "ശരിയായ WhatsApp number തരൂ: India-ക്ക് 10 അക്കം, മറ്റ് രാജ്യങ്ങൾക്ക് country code-ഓടെ (ഉദാ: +968 9123 4567).") };
  const local = full.startsWith("91") ? full.slice(2) : full.slice(-8);
  if (/^(\d)\1+$/.test(local) || /0123456789|1234567890|9876543210|123456789|987654321/.test(full) || /^(\d)\1{6,}/.test(local))
    return { err: R("That number looks made up. Please give your real WhatsApp number: our team confirms every enquiry on WhatsApp.", "ആ number ശരിയല്ലെന്ന് തോന്നുന്നു. യഥാർത്ഥ WhatsApp number തരൂ: ഓരോ enquiry-യും team WhatsApp-ൽ ആണ് confirm ചെയ്യുന്നത്.") };
  return { val: "+" + full };
}
function checkEmail(v){
  v = v.trim().toLowerCase();
  if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(v)) return { err: R("Please type a valid email address, like name@gmail.com.", "ശരിയായ email type ചെയ്യൂ, ഉദാ: name@gmail.com.") };
  const dom = v.split("@")[1];
  if (TYPO_DOMAINS[dom]) return { err: R(`Did you mean **${v.split("@")[0]}@${TYPO_DOMAINS[dom]}**? Please type it again.`, `**${v.split("@")[0]}@${TYPO_DOMAINS[dom]}** ആണോ ഉദ്ദേശിച്ചത്? ഒന്നുകൂടി type ചെയ്യൂ.`) };
  if (DISPOSABLE.test(v) || FAKE_WORDS.test(v.split("@")[0]) || /^(example|test)\./.test(dom)) return { err: R("Please use your own regular email (temporary or test emails can't be used).", "നിങ്ങളുടെ സ്വന്തം email തരൂ (temporary / test emails പറ്റില്ല).") };
  return { val: v };
}
function checkPlace(v){
  v = v.replace(/\s+/g, " ").trim();
  const letters = (v.match(/[A-Za-zഀ-ൿ]/g) || []).length;
  if (letters < 3 || FAKE_WORDS.test(v)) return { err: R("Please type your town or area and district (for example: Kakkanad, Ernakulam, or Muscat, Oman).", "നിങ്ങളുടെ സ്ഥലം / area-യും district-ഉം type ചെയ്യൂ (ഉദാ: Kakkanad, Ernakulam, അല്ലെങ്കിൽ Muscat, Oman).") };
  return { val: v };
}
function checkGoal(v){
  v = v.replace(/\s+/g, " ").trim();
  if ((v.match(/[A-Za-zഀ-ൿ]/g) || []).length < 3) return { err: R("Please tell me in a few words what you want to learn or achieve.", "എന്ത് പഠിക്കണം / എന്ത് ആകണം എന്ന് കുറച്ച് വാക്കുകളിൽ പറയൂ.") };
  return { val: v };
}

const LEAD_STEPS = [
  { key: "name",  check: checkName,  ask: () => R("Great, let's send your enquiry to our team. What's your full name?", "ശരി, നിങ്ങളുടെ enquiry team-ന് അയക്കാം. നിങ്ങളുടെ മുഴുവൻ പേര് എന്താണ്?") },
  { key: "phone", check: checkPhone, ask: (d) => R(`Thanks, ${d.name}. Your WhatsApp number? (with country code if you're outside India)`, `നന്ദി, ${d.name}. നിങ്ങളുടെ WhatsApp number? (India-ക്ക് പുറത്താണെങ്കിൽ country code-ഓടെ)`) },
  { key: "email", check: checkEmail, ask: () => R("Your email address?", "നിങ്ങളുടെ email?") },
  { key: "place", check: checkPlace, ask: () => R("Your location: town or area, and district?", "നിങ്ങളുടെ സ്ഥലം: town / area, district?") },
  { key: "goal",  check: checkGoal,  ask: () => R("Last one: what are you looking for? Which course, or what do you want to learn in networking or IT?", "അവസാന ചോദ്യം: നിങ്ങൾ എന്താണ് നോക്കുന്നത്? ഏത് course, അല്ലെങ്കിൽ networking / IT-യിൽ എന്താണ് പഠിക്കേണ്ടത്?"),
    quick: () => [lastRec, "CCNA", "Windows System Admin", "IT Admin Combo", "CCNP Enterprise"].filter((x, i, a) => x && a.indexOf(x) === i).map(x => ({ label: x })) },
];
function startLead(){
  flow = { type: "lead", step: 0, data: {}, tries: 0 };
  reply(LEAD_STEPS[0].ask(flow.data) + R("\n(Type **cancel** any time to stop.)", "\n(നിർത്താൻ എപ്പോൾ വേണമെങ്കിലും **cancel** എന്ന് type ചെയ്യൂ.)"));
}
function leadStep(q){
  const f = flow, step = LEAD_STEPS[f.step];
  const res = step.check(q);
  if (res.err) {
    // The visitor asked a question instead of answering: answer it, then ask again.
    const topic = q.split(/\s+/).length > 2 || /\?/.test(q) ? matchTopic(q) : null;
    if (topic && step.key !== "goal") { answerTopic(topic); setTimeout(() => reply(R("To continue your enquiry: ", "Enquiry തുടരാൻ: ") + step.ask(f.data)), 700); return; }
    f.tries++;
    return reply(res.err + (f.tries >= 3 ? R("\nIf it's easier, message us directly:", "\nഅതാണ് എളുപ്പമെങ്കിൽ നേരിട്ട് message ചെയ്യൂ:") + waBtn() : ""), step.quick ? step.quick() : null);
  }
  f.data[step.key] = res.val; f.tries = 0; f.step++;
  if (f.step < LEAD_STEPS.length) { const n = LEAD_STEPS[f.step]; return reply(n.ask(f.data), n.quick ? n.quick() : null); }
  finishLead(f.data);
}
function finishLead(d){
  flow = null;
  const ref = "CK-" + String(Math.floor(1000 + Math.random() * 9000));
  const msg = `Hi Cyber Kalari, course enquiry (Ref ${ref})\nName: ${d.name}\nWhatsApp: ${d.phone}\nEmail: ${d.email}\nLocation: ${d.place}\nLooking for: ${d.goal}`;
  const summary = R(
    `Please check your details:\n• Name: ${d.name}\n• WhatsApp: ${d.phone}\n• Email: ${d.email}\n• Location: ${d.place}\n• Looking for: ${d.goal}\nReference: **${ref}**\n\nLast step: tap the button and **send the message from WhatsApp number ${d.phone}**. That confirms the details are really yours, and our team replies there with fees, batch and the next steps.`,
    `നിങ്ങളുടെ details ഒന്ന് നോക്കൂ:\n• പേര്: ${d.name}\n• WhatsApp: ${d.phone}\n• Email: ${d.email}\n• സ്ഥലം: ${d.place}\n• നോക്കുന്നത്: ${d.goal}\nReference: **${ref}**\n\nഅവസാന step: താഴെയുള്ള button അമർത്തി **${d.phone} എന്ന WhatsApp number-ൽ നിന്ന് message അയക്കൂ**. Details നിങ്ങളുടേത് തന്നെയാണെന്ന് അതോടെ confirm ആകും. Fees, batch, അടുത്ത steps എന്നിവ team അവിടെ മറുപടി തരും.`);
  reply(summary + "\n[" + R("Confirm on WhatsApp", "WhatsApp-ൽ confirm ചെയ്യൂ") + "](" + waUrl(msg) + ")",
    [{ label: R("Edit details", "Details മാറ്റണം"), act: startLead }, Q.courses()]);
}

/* ===== Send ===== */
function sendText(text){
  text = text.trim();
  if (!text) return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  $("langHint").classList.add("hide"); $("langMl").classList.remove("attn");
  removeQuick();
  addMessage("user", text);
  input.value = ""; autosize(); send.disabled = true;
  typing.classList.add("show"); scrollDown();
  setTimeout(() => handle(text), 450);
}
setStatus(true, T("subtitle"));

/* ===== Input ===== */
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
input.addEventListener("input", () => { autosize(); send.disabled = !input.value.trim(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(input.value); } });
send.onclick = () => sendText(input.value);
$("langEn").onclick = () => setLang("en");
$("langMl").onclick = () => setLang("ml");

/* ===== Free device mic (speech-to-text) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR) {
  mic.title = "Voice input not supported in this browser. Please type.";
  mic.style.opacity = .4;
}
mic.onclick = () => {
  if (!SR) { addSystem(T("noMic")); return; }
  if (listening) { rec.stop(); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = T("micLang");
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = "";
  rec.onstart = () => { listening = true; mic.classList.add("listening"); };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    input.value = (finalText + interim).trim(); autosize(); send.disabled = !input.value.trim();
  };
  rec.onerror = (e) => { if (e.error === "not-allowed") addSystem(T("micPerm")); };
  rec.onend = () => {
    listening = false; mic.classList.remove("listening");
    if (finalText.trim()) sendText(finalText);
  };
  rec.start();
};

/* ===== Voice help guide ===== */
function guessDevice(){
  const ua = navigator.userAgent;
  if (/android/i.test(ua)) return "Android";
  if (/iphone|ipad|ipod/i.test(ua)) return "iPhone";
  if (/mac os x|macintosh/i.test(ua)) return "Mac";
  return "Windows PC";
}
let helpDevice = guessDevice();
function voiceStatusText(){
  if (!window.speechSynthesis) return "";
  loadVoices();
  const ml = pickVoice("ml-IN"), en = pickVoice("en-IN") || pickVoice("en-GB") || pickVoice("en-US");
  return (ml ? T("hasMl") + ml.name : T("noMlNow")) + "  ·  " + (en ? T("hasEn") + en.name : T("noEnNow"));
}
function renderHelp(){
  $("helpTitle").textContent = T("helpTitle");
  $("helpLead").textContent = T("helpLead");
  const tabs = $("helpTabs"); tabs.innerHTML = "";
  T("tabs").forEach(d => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = d; b.setAttribute("aria-pressed", String(d === helpDevice));
    b.onclick = () => { helpDevice = d; renderHelp(); };
    tabs.appendChild(b);
  });
  $("helpBody").innerHTML = "<ol>" + T("steps")[helpDevice].map(x => "<li>" + x + "</li>").join("") + "</ol><div class=\"note\">" + T("helpNote") + "</div>";
  $("testMl").textContent = T("testMl"); $("testEn").textContent = T("testEn");
  $("voiceStatus").textContent = voiceStatusText();
}
function openHelp(){ hideSoundHint(); renderHelp(); $("helpBg").classList.remove("hide"); }
function closeHelp(){ $("helpBg").classList.add("hide"); }
$("voiceHelpBtn").onclick = openHelp;
$("helpClose").onclick = closeHelp;
$("helpBg").onclick = (e) => { if (e.target === $("helpBg")) closeHelp(); };
$("testMl").onclick = () => { speak("നമസ്കാരം! ഞാൻ Cya Mentor. എന്റെ ശബ്ദം കേൾക്കാമോ?", true); setTimeout(() => $("voiceStatus").textContent = voiceStatusText(), 300); };
$("testEn").onclick = () => { speak("Hi! I'm Cya Mentor. Can you hear me?", true); setTimeout(() => $("voiceStatus").textContent = voiceStatusText(), 300); };
if (window.speechSynthesis) speechSynthesis.addEventListener?.("voiceschanged", () => { if (!$("helpBg").classList.contains("hide")) $("voiceStatus").textContent = voiceStatusText(); });

applyLang();

/* Malayalam popup: shown once to first-time visitors who haven't picked a language */
function hideLangHint(){ $("langHint").classList.add("hide"); $("langMl").classList.remove("attn"); try { localStorage.setItem("cyaLangHint", "1"); } catch {} }
$("langHint").onclick = () => { setLang("ml"); hideLangHint(); };
$("langHintX").onclick = (e) => { e.stopPropagation(); hideLangHint(); };
let hintSeen = false; try { hintSeen = !!localStorage.getItem("cyaLangHint"); } catch {}
if (!langChosen && !hintSeen && lang === "en") {
  setTimeout(() => { if (!$("welcome") || !$("soundHint").classList.contains("hide")) return; $("langHint").classList.remove("hide"); $("langMl").classList.add("attn"); }, 1200);
  setTimeout(() => { if (!$("langHint").classList.contains("hide")) { $("langHint").classList.add("hide"); $("langMl").classList.remove("attn"); } }, 13000);
}

window.addEventListener("beforeunload", () => { if (conversation) conversation.endSession(); });
</script>
</body>
</html>
